name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  web:
    name: Web (types, P2P smoke test, build)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: npm ci
        working-directory: frontend
      - run: npx tsc --noEmit
        working-directory: frontend
      - run: npm run test:p2p
        working-directory: frontend
      - run: npm run build
        working-directory: frontend

  android:
    name: Android (release APK + AAB)
    runs-on: ubuntu-latest
    permissions:
      contents: write # publishes the build as a release asset
    env:
      # Secrets can't be used in "if:", so expose whether the Play key exists
      HAS_PLAY_KEY: ${{ secrets.PLAY_SERVICE_ACCOUNT_JSON != '' }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21
      - run: npm ci
        working-directory: frontend
      - run: npm run build:mobile
        working-directory: frontend
        env:
          # Repository *variables* (Settings > Secrets and variables > Actions > Variables).
          # These are baked into the app, so the store build needs its own copy.
          NEXT_PUBLIC_SUPPORT_EMAIL: ${{ vars.NEXT_PUBLIC_SUPPORT_EMAIL }}
          NEXT_PUBLIC_WEB_URL: ${{ vars.NEXT_PUBLIC_WEB_URL }}
      # Optional repo secrets for a Play-ready build: ANDROID_KEYSTORE_BASE64,
      # ANDROID_KEYSTORE_PASSWORD, ANDROID_KEY_ALIAS, ANDROID_KEY_PASSWORD (see MOBILE.md).
      # Without them the release APK is signed with the debug key (sideload only).
      - name: Prepare signing
        id: signing
        env:
          KEYSTORE_B64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
        run: |
          if [ -n "$KEYSTORE_B64" ]; then
            echo "$KEYSTORE_B64" | base64 -d > "$RUNNER_TEMP/release.keystore"
            # Lets you confirm the secret decodes to your exact file. Compare with
            #   Get-FileHash inferno-upload.jks -Algorithm SHA256   (PowerShell)
            # A hash reveals nothing about the key or its password.
            echo "keystore: $(stat -c %s "$RUNNER_TEMP/release.keystore") bytes, sha256 $(sha256sum "$RUNNER_TEMP/release.keystore" | cut -d' ' -f1)"
            echo "ANDROID_KEYSTORE_FILE=$RUNNER_TEMP/release.keystore" >> "$GITHUB_ENV"
            echo "signed=release key" >> "$GITHUB_OUTPUT"
            echo "release_signed=true" >> "$GITHUB_OUTPUT"
          else
            echo "signed=debug key (sideload/testing only, not for Google Play)" >> "$GITHUB_OUTPUT"
          fi
      - name: Build production (release) APK and AAB
        working-directory: frontend/android
        env:
          VERSION_CODE: ${{ github.run_number }}
          VERSION_NAME: 1.0.${{ github.run_number }}
          ANDROID_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          ANDROID_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          ANDROID_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
        run: bash ./gradlew assembleRelease bundleRelease --no-daemon
      - uses: actions/upload-artifact@v4
        with:
          name: inferno-words-android
          path: |
            frontend/android/app/build/outputs/apk/release/*.apk
            frontend/android/app/build/outputs/bundle/release/*.aab
      # Rolling public download (no GitHub login needed):
      # https://github.com/<owner>/<repo>/releases/download/latest-apk/inferno-words.apk
      - name: Publish to the "latest-apk" release
        if: github.event_name != 'pull_request' && github.ref == 'refs/heads/main'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          cp frontend/android/app/build/outputs/apk/release/app-release.apk inferno-words.apk
          cp frontend/android/app/build/outputs/bundle/release/app-release.aab inferno-words.aab
          gh release delete latest-apk --yes --cleanup-tag || true
          gh release create latest-apk inferno-words.apk inferno-words.aab             --latest --target "$GITHUB_SHA"             --title "Inferno Words 1.0.${{ github.run_number }} (Android)"             --notes "Production (release) build of commit $GITHUB_SHA. Signed with: ${{ steps.signing.outputs.signed }}. Free, no ads, no tracking."

      # Google Play (fastlane). Runs only when BOTH the upload keystore and the Play
      # service-account secret exist, and only for pushes to main. Uploads to the
      # Internal testing track; promoting further is a deliberate manual step
      # (Actions > "Play: promote release"). See MOBILE.md.
      - uses: ruby/setup-ruby@v1
        if: env.HAS_PLAY_KEY == 'true' && steps.signing.outputs.release_signed == 'true' && github.event_name != 'pull_request' && github.ref == 'refs/heads/main'
        with:
          ruby-version: "3.3"
      - name: Upload to Google Play (internal track)
        if: env.HAS_PLAY_KEY == 'true' && steps.signing.outputs.release_signed == 'true' && github.event_name != 'pull_request' && github.ref == 'refs/heads/main'
        working-directory: frontend/android
        env:
          PLAY_SERVICE_ACCOUNT_JSON: ${{ secrets.PLAY_SERVICE_ACCOUNT_JSON }}
          PLAY_RELEASE_STATUS: ${{ vars.PLAY_RELEASE_STATUS || 'draft' }}
        run: |
          printf '%s' "$PLAY_SERVICE_ACCOUNT_JSON" > "$RUNNER_TEMP/play.json"
          export PLAY_JSON_KEY_FILE="$RUNNER_TEMP/play.json"
          gem install fastlane -N
          fastlane android internal
          rm -f "$RUNNER_TEMP/play.json"

  ios:
    name: iOS (simulator build, unsigned)
    runs-on: macos-15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: npm ci
        working-directory: frontend
      - run: npm run build:mobile
        working-directory: frontend
        env:
          # Repository *variables* (Settings > Secrets and variables > Actions > Variables).
          # These are baked into the app, so the store build needs its own copy.
          NEXT_PUBLIC_SUPPORT_EMAIL: ${{ vars.NEXT_PUBLIC_SUPPORT_EMAIL }}
          NEXT_PUBLIC_WEB_URL: ${{ vars.NEXT_PUBLIC_WEB_URL }}
      - name: Build for simulator
        working-directory: frontend/ios/App
        run: |
          xcodebuild -project App.xcodeproj -scheme App \
            -configuration Debug -sdk iphonesimulator \
            -destination 'generic/platform=iOS Simulator' \
            CODE_SIGNING_ALLOWED=NO build | tail -40
